services:
  spark-iceberg:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: spark-iceberg
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_USER}
      AWS_SECRET_ACCESS_KEY: ${LAKE_PASSWORD}
      AWS_REGION: us-east-1
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/data:/opt/spark/data
    entrypoint: ["/bin/bash"]
    tty: true
    stdin_open: true
    networks:
      - lake-net

networks:
  lake-net:
    external: true
    name: lake-net